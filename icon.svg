<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Power Menu: the power symbol, rose to orange. -->
  <defs>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="0.55" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <!-- user-space: a straight line has no width for a bounding-box gradient -->
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="32" x2="32" y1="4" y2="32">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" opacity="0.35" transform="translate(1.5 1.5)">
    <path d="M20.5 15.5 A22 22 0 1 0 43.5 15.5"/>
    <path d="M32 6 V30"/>
  </g>
  <path d="M20.5 15.5 A22 22 0 1 0 43.5 15.5" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round"/>
  <path d="M32 6 V30" fill="none" stroke="url(#bar)" stroke-width="8" stroke-linecap="round"/>
  <path d="M15 30 A17 17 0 0 1 19 20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
